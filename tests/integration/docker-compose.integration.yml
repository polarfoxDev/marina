services:
  # S3-compatible destination for the integration tests -- replaces the
  # local restic repository volume. container_name is set explicitly so
  # the mesh stack (a separate compose project on the same external
  # network) can reach it by a stable hostname.
  minio:
    image: minio/minio:latest
    container_name: marina-it-minio
    command: ["server", "/data"]
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 20
    networks:
      - mesh

  # One-shot bucket bootstrap. Marina's S3 backend never creates buckets
  # itself (Init only checks they exist), so the bucket has to be created
  # before marina starts.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://marina-it-minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/it-bucket
      "
    networks:
      - mesh

  marina:
    image: marina:latest
    container_name: marina-it
    # user: "0:0" # run as root in integration to initialize /backup repo
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - CONFIG_FILE=/config/config.yml
      - API_PORT=8080
      - NODE_NAME=integration-server
      - MARINA_AUTH_PASSWORD=integration
    volumes:
      - data:/var/lib/marina/
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./staging:/backup
      - ./config.yml:/config/config.yml:ro
    depends_on:
      createbuckets:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      mysql:
        condition: service_started
      mariadb:
        condition: service_started
      mongo:
        condition: service_started
      postgres-empty:
        condition: service_started
      volume-writer:
        condition: service_started
      volume-writer-empty:
        condition: service_started
      volume-writer-plain:
        condition: service_started
    networks:
      - mesh

  postgres:
    image: postgres:16-alpine
    container_name: pg-it
    environment:
      - POSTGRES_PASSWORD=pgpass
      - POSTGRES_DB=testdb
      - POSTGRES_USER=postgres
      - PGPASSWORD=pgpass

  mysql:
    image: mysql:8.4
    container_name: mysql-it
    environment:
      - MYSQL_ROOT_PASSWORD=mysqlpass

  mariadb:
    image: mariadb:11
    container_name: mariadb-it
    environment:
      - MARIADB_ROOT_PASSWORD=maripass

  mongo:
    image: mongo:7
    container_name: mongo-it
    command: ["--quiet"]

  # Empty database container - should fail validation and be excluded from backups
  # Pre-hook creates a fake pg_dumpall that outputs nothing, simulating a silent dump failure
  postgres-empty:
    image: postgres:16-alpine
    container_name: pg-empty-it
    environment:
      - POSTGRES_PASSWORD=pgpass
      - POSTGRES_DB=testdb
      - POSTGRES_USER=postgres
      - PGPASSWORD=pgpass

  volume-writer:
    image: alpine:3.20
    container_name: volwriter-it
    command: ["sh", "-lc", "echo 'volume test data' > /mnt/data/test.txt && dd if=/dev/urandom of=/mnt/data/random.bin bs=1M count=100 && sleep infinity"]
    volumes:
      - testdata:/mnt/data

  # Empty volume writer - should fail validation and be excluded from backups
  volume-writer-empty:
    image: alpine:3.20
    container_name: volwriter-empty-it
    command: ["sh", "-lc", "touch /mnt/data/empty.txt && sleep infinity"]
    volumes:
      - testdata-empty:/mnt/data

  # Dedicated volume for the unencrypted instance, kept separate from
  # volume-writer so the two instances' stopAttached handling never races
  # on the same container.
  volume-writer-plain:
    image: alpine:3.20
    container_name: volwriter-plain-it
    command: ["sh", "-lc", "echo 'plain instance test data' > /mnt/data/test.txt && sleep infinity"]
    volumes:
      - testdata-plain:/mnt/data

volumes:
  data:
  testdata:
  testdata-empty:
  testdata-plain:

networks:
  mesh:
    external: true
