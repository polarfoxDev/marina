instances:
  - id: backup2
    s3:
      endpoint: marina-it-minio:9000
      bucket: it-bucket
      accessKeyId: minioadmin
      secretAccessKey: minioadmin
      useSSL: false
      forcePathStyle: true
    encryption:
      password: testpass
    schedule: "* * * * *" # Every minute for fast integration testing
    targets:
      - volume: mesh_testdata2 # volume prefixed by docker-compose
        stopAttached: true

# Global defaults
retention: "7d:4w:6m"
stopAttached: true
timeout: "30s"

nodeName: server2
authPassword: mesh

peers:
  - http://marina-it:8080
