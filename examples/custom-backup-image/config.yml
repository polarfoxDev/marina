instances:
  - id: custom-backup
    customImage: marina/example-backup:latest # Custom Docker image
    schedule: "* * * * *" # every minute
    env:
      BACKUP_ENDPOINT: https://backup.example.com
      BACKUP_TOKEN: example-token-12345
    targets:
      - volume: custom-data
  # Marina's built-in S3 backend, shown side by side with the custom image
  # backend above for comparison.
  - id: s3-backup
    s3:
      endpoint: s3.example.com
      bucket: example-bucket
      accessKeyId: example-access-key
      secretAccessKey: example-secret-key
    schedule: "* * * * *" # every minute
    targets:
      - volume: s3-data
