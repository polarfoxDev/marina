instances:
  # S3-compatible destination with end-to-end encryption. Marina archives
  # each volume/database as a separate tar+zstd object and uploads it
  # directly via the S3 API -- there is no external tool involved.
  - id: hetzner-s3
    s3:
      endpoint: fsn1.your-objectstorage.com # host[:port], no scheme
      region: fsn1
      bucket: marina-backups # must already exist
      # prefix: prod                        # optional key prefix within the bucket
      accessKeyId: your-access-key
      secretAccessKey: your-secret-key
      # useSSL: true                        # default true
      # forcePathStyle: false               # default false; set true for MinIO and most non-AWS S3-compatible services
    encryption:
      # Optional end-to-end encryption (age, password-based). If omitted,
      # archives are stored unencrypted. Losing this password means losing
      # the backups -- there is no recovery.
      password: your-encryption-password
    schedule: "0 2 * * *" # Daily at 2 AM - backs up all targets assigned to this instance
    retention: "30d:12w:24m" # Optional: instance-specific retention (overrides global)
    timeout: "10m" # Optional: instance-specific timeout (overrides global, default 60m)
    targets:
      # Simple syntax (recommended for simple targets)
      - volume: app-uploads
      - volume: app-config
      - db: app-postgres # dbKind auto-detected from image (postgres, mysql, mariadb, mongo, redis)
      - db: app-mysql
      - db: app-mariadb
      # Full object syntax (use when you need custom settings)
      # - volume: app-uploads
      #   paths: ["/data", "/config"]  # Specific paths instead of root "/"
      #   stopAttached: true           # Stop containers during backup
      # - db: app-postgres
      #   dbKind: postgres              # Override auto-detection
      #   dumpArgs: ["--clean", "--if-exists"]  # Custom dump arguments
    beforeBackup: # Commands to run before backup starts
      - container: app-postgres
        command: "psql -U myapp -c 'CHECKPOINT;'"
      - image: ubuntu:latest
        command: "curl -X POST https://my.app/prepare-backup"
    afterBackup: # Commands to run after backup completes
      - container: app-postgres
        command: "psql -U myapp -c 'VACUUM;'"
      - image: ubuntu:latest
        command: "curl -X POST https://my.app/backup-complete"

  # S3-compatible destination without encryption -- objects are stored as
  # plain tar+zstd in the bucket. Fine if the bucket itself is private and
  # trusted; anyone with read access to it can read the backup contents.
  - id: do-spaces
    s3:
      endpoint: nyc3.digitaloceanspaces.com
      region: nyc3
      bucket: my-backup-bucket
      accessKeyId: ${DO_SPACES_KEY}
      secretAccessKey: ${DO_SPACES_SECRET}
    schedule: "30 2 * * *" # Daily at 2:30 AM
    targets:
      - volume: ${BACKUP_VOLUME} # Environment variable expansion also works in targets
        paths: ["/data", "/config"]

  # Example: self-hosted MinIO (or any S3-compatible service that needs
  # path-style requests instead of virtual-hosted-style).
  # - id: minio-backup
  #   s3:
  #     endpoint: minio.internal:9000
  #     bucket: marina-backups
  #     accessKeyId: ${MINIO_ACCESS_KEY}
  #     secretAccessKey: ${MINIO_SECRET_KEY}
  #     useSSL: false
  #     forcePathStyle: true
  #   encryption:
  #     password: ${MARINA_ENC_PASSWORD}
  #   schedule: "0 5 * * *" # Daily at 5 AM
  #   targets:
  #     - volume: app-data
  #     - db: postgres

  # Example: Custom Docker image backend (alternative to S3, for anyone who
  # needs a different destination -- SFTP, another cloud provider, etc.)
  # - id: custom-backup
  #   customImage: marina/example-backup:latest # Custom Docker image
  #   schedule: "0 4 * * *" # Daily at 4 AM
  #   timeout: "15m" # Custom images may need different timeouts
  #   env:
  #     BACKUP_ENDPOINT: https://backup.example.com
  #     BACKUP_TOKEN: ${BACKUP_TOKEN}
  #   targets:
  #     - volume: custom-data

# Global defaults (can be overridden by instance config or target config)
# If not specified here, Marina uses hardcoded defaults:
#   - retention: "7d:4w:6m" (7 daily, 4 weekly, 6 monthly)
#   - stopAttached: false
#   - timeout: "60m" (60 minutes)
#   - dbPath: "/var/lib/marina/marina.db"
#   - apiPort: "8080"
retention: "14d:8w:12m" # Format: daily:weekly:monthly - applies to all instances unless overridden
stopAttached: true # Stop containers when backing up volumes (can be overridden per target)
timeout: "60m" # Global timeout for backend operations (format: "5m", "30s", "1h") - can be overridden per instance

# Runtime configuration
dbPath: "/var/lib/marina/marina.db" # Database path for job status and logs (default: "/var/lib/marina/marina.db")
apiPort: "8080" # API server port (default: "8080")
corsOrigins: # Additional CORS origins for API server (optional)
  - https://marina.example.com
  - https://backup.example.com
  # Or use environment variables:
  # - ${MARINA_CORS_ORIGIN}

# Optional: Custom node name (defaults to hostname if not specified)
# Used to identify this Marina instance in logs and the dashboard
nodeName: ${NODE_NAME} # or "production-server-1"

# Optional: Authentication password for API and dashboard access
# If not set, authentication is disabled (not recommended for production)
# All nodes in a federation should use the same password
authPassword: ${MARINA_AUTH_PASSWORD} # or "your-secure-password"

# Optional: Peer federation - connect multiple Marina instances
# When configured, the dashboard will show backup schedules from all connected nodes
# Each peer should be reachable via HTTP/HTTPS and use the same authPassword
peers:
  - http://marina-node2:8080
  - http://marina-node3:8080
  # Or use environment variables:
  # - ${PEER_NODE_1}
  # - ${PEER_NODE_2}
